name: Bug report
description: Report a reproducible problem without sharing private material.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real audio, transcripts, API keys, database files, payment data, or personal/customer information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use synthetic data only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and app version
    validations:
      required: true
