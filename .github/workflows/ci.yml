name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # test:growth relies on --experimental-strip-types, available from Node 22.6.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app
      - name: Type check
        run: npm run typecheck
        working-directory: app
      - name: Frontend build
        run: npm run build
        working-directory: app
      - name: Growth timeline tests
        run: npm run test:growth
        working-directory: app
      - name: UI smoke tests
        run: npm run test:ui
        working-directory: app
      - name: Rust format check
        run: cargo fmt --check
        working-directory: app/src-tauri
      - name: Rust tests
        run: cargo test --features mcp-bin
        working-directory: app/src-tauri

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning must be able to inspect the complete public history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
